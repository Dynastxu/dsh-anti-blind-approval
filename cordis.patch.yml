# dsh-anti-blind-approval profile patch layer — insert one loader entry for the
# plugin package. The browser half is picked up by dsh-client-modules through
# the package's dsh.client declaration, exactly like the shipped ui-* packages.
- insert:
    - id: dsh-anti-blind-approval
      name: 'dsh-anti-blind-approval'
      config:
        enabled: true
        model: ''
        delaySeconds: 3
        prompt: ''
        reviewTimeoutMs: 10000
